# Tareas programadas de Solid Queue (solo se ejecutan si corre el worker de jobs:
# bin/jobs, o Puma con SOLID_QUEUE_IN_PUMA=true). Ver README.
production:
  daily_sync:
    # Solo sincroniza las ventas para que el dashboard quede al dia.
    # El informe diario por correo esta PAUSADO a pedido del usuario (2026-11-04):
    # para reactivarlo, cambiar esta clase por DailyReportJob (hace sync + envio)
    # y completar SMTP_USER, SMTP_PASSWORD, MAIL_FROM y MAIL_TO en el .env.
    class: SyncSalesJob
    queue: default
    # Todos los dias a las 00:00 en la zona horaria del local.
    schedule: "0 0 * * * <%= ENV.fetch('TZ_NAME', 'America/Santiago') %>"
